version: '3.8'

services:
  wajato-db:
    image: postgres:15-alpine
    container_name: wajato-db
    restart: always
    environment:
      POSTGRES_USER: wajato
      POSTGRES_PASSWORD: wajato_secure_password_9988
      POSTGRES_DB: wajato_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Cria os bancos do Evolution Go na primeira inicialização do volume.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - wajato-net

  wajato-redis:
    image: redis:7-alpine
    container_name: wajato-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - wajato-net

  wajato-evolution:
    image: evoapicloud/evolution-go:latest
    container_name: wajato-evolution
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Evolution Go — NÃO usa as vars da v1 Node (AUTHENTICATION_API_KEY,
      # DATABASE_PROVIDER, DATABASE_CONNECTION_URI, CACHE_REDIS_*).
      - SERVER_PORT=8080
      - CLIENT_NAME=evolution
      # Chave global da API Go (o app envia no header `apikey`).
      # Deve ser o MESMO valor de EVOLUTION_API_KEY no .env do app.
      - GLOBAL_API_KEY=${EVOLUTION_API_KEY:-wajato_global_api_key_5544}
      # O Go exige dois bancos Postgres separados (criados pelo init em
      # docker/postgres-init na primeira subida do wajato-db).
      - POSTGRES_AUTH_DB=postgresql://${POSTGRES_USER:-wajato}:${POSTGRES_PASSWORD:-wajato_secure_password_9988}@wajato-db:5432/evogo_auth?sslmode=disable
      - POSTGRES_USERS_DB=postgresql://${POSTGRES_USER:-wajato}:${POSTGRES_PASSWORD:-wajato_secure_password_9988}@wajato-db:5432/evogo_users?sslmode=disable
      - DATABASE_SAVE_MESSAGES=false
      - WADEBUG=INFO
      - LOGTYPE=console
      - WEBHOOK_URL=http://host.docker.internal:3000/api/webhook
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://host.docker.internal:3000/api/webhook
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - wajato-db
    networks:
      - wajato-net

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  wajato-net:
    driver: bridge
